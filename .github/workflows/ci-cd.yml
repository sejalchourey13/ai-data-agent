name: AI Agent CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      ollama:
        image: ollama/ollama
        ports:
          - 11434:11434

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t ai-data-agent .

    - name: Pull model
      run: |
        docker exec $(docker ps -q --filter ancestor=ollama/ollama) ollama pull gemma:2b

    - name: Run AI Agent
      run: docker run --network host ai-data-agent
